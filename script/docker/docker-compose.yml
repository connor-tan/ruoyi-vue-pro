name: ${COMPOSE_PROJECT_NAME:-xiaokanhui-dev}

services:
  mysql-master:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${MYSQL_MASTER_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-connor-890820}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ruoyi-vue-pro}
    command:
      - --default-time-zone=+08:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-master-data:/var/lib/mysql
      - ./mysql-replication/master/conf.d/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./mysql-replication/master/init/ruoyi-vue-pro.sql:/docker-entrypoint-initdb.d/10-ruoyi-vue-pro.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  mysql-slave:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${MYSQL_SLAVE_HOST_PORT:-3308}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-connor-890820}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ruoyi-vue-pro}
    command:
      - --default-time-zone=+08:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-slave-data:/var/lib/mysql
      - ./mysql-replication/slave/conf.d/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  mysql-replica-init:
    image: mysql:8.4
    restart: "no"
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-connor-890820}
      MASTER_HOST: mysql-master
      MASTER_PORT: 3306
      SLAVE_HOST: mysql-slave
      SLAVE_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ruoyi-vue-pro}
      REPLICATION_USER: ${REPLICATION_USER:-repl}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replconnor-890820}
      REPLICA_RESEED_ON_INIT: ${REPLICA_RESEED_ON_INIT:-true}
    volumes:
      - ./mysql-replication/scripts/setup-replica.sh:/scripts/setup-replica.sh:rohtop
    entrypoint:
      - /bin/bash
      - /scripts/setup-replica.sh

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi"]
      interval: 5s
      timeout: 3s
      retries: 30

  server:
    build:
      context: ../..
      dockerfile: script/docker/yudao-server/Dockerfile
      args:
        MAVEN_BUILD_ARGS: ${MAVEN_BUILD_ARGS:-}
    image: yudao-server:dev
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-48080}:48080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SERVER_APP_PORT: 48080
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx512m -Djava.security.egd=file:/dev/./urandom}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ruoyi-vue-pro}
      MYSQL_MASTER_HOST: mysql-master
      MYSQL_MASTER_PORT: 3306
      MYSQL_SLAVE_HOST: mysql-slave
      MYSQL_SLAVE_PORT: 3306
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-connor-890820}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-connor-890820}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      QUARTZ_AUTO_STARTUP: ${QUARTZ_AUTO_STARTUP:-true}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info}
      ARGS: >-
        --spring.profiles.active=${SPRING_PROFILES_ACTIVE:-docker}
        ${SERVER_EXTRA_ARGS:-}
    depends_on:
      mysql-replica-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:48080/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  admin:
    build:
      context: ../../../yudao-ui-admin-vue3
      dockerfile: Dockerfile
      args:
        ADMIN_BUILD_MODE: ${ADMIN_BUILD_MODE:-prod}
        VITE_BASE_URL: ""
        VITE_API_URL: /admin-api
        VITE_APP_TITLE: ${ADMIN_TITLE:-校刊汇管理系统}
    image: yudao-admin:dev
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mysql-master-data:
    driver: local
  mysql-slave-data:
    driver: local
  redis-data:
    driver: local
